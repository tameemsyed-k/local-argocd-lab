apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tameemsyed-k/local-argocd-lab.git'
    targetRevision: main
    path: nginx
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: web-apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
